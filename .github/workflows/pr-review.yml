# .github/workflows/pr-review.yml
name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write          # needed for label creation

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic requests pyyaml

      # NEW: download the existing reviews database (if any)
      - name: Download review database
        uses: actions/download-artifact@v4
        with:
          name: review-database
          path: .github/data/
        continue-on-error: true   # first run: no artifact yet, that's fine

      - name: Run Claude review
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
          PR_NUMBER:          ${{ github.event.pull_request.number }}
          PR_TITLE:           ${{ github.event.pull_request.title }}
          PR_AUTHOR:          ${{ github.event.pull_request.user.login }}   # NEW
          BASE_SHA:           ${{ github.event.pull_request.base.sha }}
          HEAD_SHA:           ${{ github.event.pull_request.head.sha }}
          REVIEW_DB_PATH:     .github/data/reviews.db
        run: python .github/scripts/review.py

      # NEW: upload the updated database so it persists
      - name: Upload review database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-database
          path: .github/data/reviews.db
          retention-days: 90
          overwrite: true
